---
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: check-gate-labels
spec:
  description: |
    Checks whether all required gate labels are present on the GitHub PR
    associated with the triggering commit.

    GATE_LABELS is a comma-separated list of label names (e.g.
    "rc-sanity-check,channel-1.19"). All listed labels must be present
    for the step to emit proceed=true. Alternatives are separated by "|":
    "channel-1.22|release-1.22" proceeds on either label, and
    "release-1.22,nightly|channel-1.22" on both of the first two or on the
    third. The nightly-catalog automation labels its PRs release-X.Y, so
    this lets the release tier take those without relabelling.

    Push events (GitHub answers that no PR contains the commit) proceed
    regardless of labels, unless require-pr is "true". An empty GATE_LABELS
    value always proceeds.

    A GitHub API call that fails (rate limit, outage) after retries skips
    the tests: "could not tell" is not "no PR". Anonymous calls share a
    60/hour limit per egress IP across the whole Konflux cluster, so this
    happens. On 2026-10-15 the commit lookup for #318's merge returned
    nothing for one gate and #318 for another a few seconds apart, and the
    one that got nothing started a full release run.
  params:
    - name: gate-labels
      type: string
      description: >
        Comma-separated list of PR labels that must ALL be present to
        proceed. Empty string means no gating (always proceed).
    - name: source-git-url
      type: string
      description: Source repository URL (used to derive the GitHub repo slug).
    - name: source-git-revision
      type: string
      description: Commit SHA used to look up the associated pull request.
    - name: github-token
      type: string
      description: >
        GitHub personal access token (or app token) used to authenticate
        GitHub API requests. Prevents anonymous rate-limiting (60 req/hour
        per IP) in shared Konflux environments. Pass an empty string to
        fall back to unauthenticated requests.
      default: ""
    - name: event-type
      type: string
      description: >
        test-event-type from Konflux's test metadata ("pull_request" or
        "push"). With require-pr "true", a push skips: the change was already
        tested as its PR, and a merged PR's labels would otherwise run it again.
      default: ""
    - name: pr-number
      type: string
      description: >
        pull-request-number from Konflux's test metadata. When set, the PR is
        read directly instead of looked up from the commit.
      default: ""
    - name: require-pr
      type: string
      description: >
        "true" to skip when no PR is found for the commit, instead of treating
        it as a push event. For gates that must only ever run on a labelled PR,
        such as the release tier, which claims a cluster per leg.
      default: "false"
  results:
    - name: proceed
      description: "true if tests should run, false to skip"
  image: registry.access.redhat.com/ubi9/ubi-minimal:latest
  env:
    - name: GATE_LABELS
      value: $(params.gate-labels)
    - name: SOURCE_GIT_URL
      value: $(params.source-git-url)
    - name: SOURCE_GIT_REVISION
      value: $(params.source-git-revision)
    - name: GITHUB_TOKEN
      value: $(params.github-token)
    - name: REQUIRE_PR
      value: $(params.require-pr)
    - name: EVENT_TYPE
      value: $(params.event-type)
    - name: PR_NUMBER_IN
      value: $(params.pr-number)
  script: |
    #!/bin/sh
    set -eu

    PROCEED=true

    if [ -z "${GATE_LABELS}" ]; then
      echo "No gate labels configured, proceeding"
      echo -n "${PROCEED}" > $(step.results.proceed.path)
      exit 0
    fi

    echo "Gate labels required: ${GATE_LABELS}"

    # Build Authorization header for GitHub API calls; fall back to no header
    # when no token is provided so the stepaction still works unauthenticated.
    GITHUB_AUTH_HEADER=""
    if [ -n "${GITHUB_TOKEN}" ]; then
      GITHUB_AUTH_HEADER="Authorization: Bearer ${GITHUB_TOKEN}"
    fi

    REPO_SLUG=""
    if [ -n "${SOURCE_GIT_URL}" ]; then
      REPO_SLUG=$(echo "${SOURCE_GIT_URL}" | sed 's|.*github.com/||' | sed 's|\.git$||')
    fi

    # GET a GitHub API path into $BODY. Retries, and returns non-zero if it never
    # got a 200 -- the caller must not read a failed call as an empty answer.
    gh_get() {
      for attempt in 1 2 3 4; do
        if [ -n "${GITHUB_AUTH_HEADER}" ]; then
          RESP=$(curl -sS -m 30 -w '\n%{http_code}' -H "${GITHUB_AUTH_HEADER}" "https://api.github.com/repos/${REPO_SLUG}/$1" 2>&1 || true)
        else
          RESP=$(curl -sS -m 30 -w '\n%{http_code}' "https://api.github.com/repos/${REPO_SLUG}/$1" 2>&1 || true)
        fi
        CODE=$(printf '%s' "$RESP" | tail -n1)
        BODY=$(printf '%s' "$RESP" | sed '$d')
        [ "$CODE" = "200" ] && return 0
        echo "GitHub API $1: HTTP ${CODE:-none} (attempt $attempt)"
        sleep $((attempt * 15))
      done
      return 1
    }

    skip() {
      echo "$1, skipping tests"
      echo -n false > $(step.results.proceed.path)
      echo "Result: proceed=false"
      exit 0
    }

    # A merge is tested as its PR; a gate that must only run on a labelled PR does not
    # run the merge commit again. Before this, a labelled PR that merged ran twice: on
    # its PR snapshot, and on the push snapshot, whose commit GitHub maps back to it.
    if [ "${REQUIRE_PR}" = "true" ] && [ "${EVENT_TYPE}" = "push" ]; then
      skip "Push event, and this gate runs on pull requests only"
    fi

    PR_NUMBER=$(printf '%s' "${PR_NUMBER_IN}" | tr -cd '0-9')
    if [ -n "${PR_NUMBER}" ]; then
      echo "PR #${PR_NUMBER} from the test metadata"
    elif [ -n "${REPO_SLUG}" ] && [ -n "${SOURCE_GIT_REVISION}" ]; then
      echo "Looking up PRs for commit ${SOURCE_GIT_REVISION}..."
      # Right after a merge GitHub can briefly answer [] for the merge commit, so
      # ask again before concluding there is no PR.
      for lookup in 1 2 3; do
        gh_get "commits/${SOURCE_GIT_REVISION}/pulls" || skip "Could not look up PRs for the commit"
        PR_NUMBER=$(echo "${BODY}" | grep -o '"number": *[0-9]*' | head -1 | grep -o '[0-9]*' || true)
        [ -n "${PR_NUMBER}" ] && break
        [ "${REQUIRE_PR}" = "true" ] || break
        sleep 20
      done
    fi

    if [ -z "${PR_NUMBER}" ]; then
      [ "${REQUIRE_PR}" = "true" ] && skip "No PR found for this commit and require-pr is set"
      echo "No PR found for this commit, proceeding (push event)"
      echo -n "${PROCEED}" > $(step.results.proceed.path)
      exit 0
    fi

    echo "Found PR #${PR_NUMBER}, checking labels..."
    gh_get "pulls/${PR_NUMBER}" || skip "Could not read the labels of PR #${PR_NUMBER}"
    LABELS=$(echo "${BODY}" | grep -o '"name": *"[^"]*"' | sed 's/"name": *"//;s/"$//' || true)
    echo "PR labels: ${LABELS:-none}"

    # Groups separated by "|" are alternatives; within a group, separated by ",",
    # every label must be present. The first group that is complete proceeds.
    # Splitting goes through tr so each item is its own input line: a single 'read'
    # variable does not distribute IFS fields across commas.
    PROCEED=false
    while IFS= read -r group; do
      group=$(echo "$group" | tr -d ' ')
      [ -z "$group" ] && continue
      complete=true
      while IFS= read -r required; do
        [ -z "$required" ] && continue
        if ! echo "${LABELS}" | grep -qx "$required"; then
          complete=false
          break
        fi
      done <<< "$(printf '%s' "$group" | tr ',' '\n')"
      if [ "$complete" = true ]; then
        echo "Labels '${group}' found"
        PROCEED=true
        break
      fi
      echo "Labels '${group}' not all present"
    done <<< "$(printf '%s' "${GATE_LABELS}" | tr '|' '\n')"
    [ "$PROCEED" = true ] || echo "No label group complete, skipping tests"

    echo -n "${PROCEED}" > $(step.results.proceed.path)
    echo "Result: proceed=${PROCEED}"
