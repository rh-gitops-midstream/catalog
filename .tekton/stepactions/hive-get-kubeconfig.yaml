---
# Hive equivalent of eaas-get-ephemeral-cluster-credentials.
#
# Deliberately the same shape: it writes a kubeconfig into the named volume and returns
# the filename, so a task can swap between the EaaS and Hive provisioners by changing
# this one step and nothing else. Everything downstream just sets
# KUBECONFIG=/credentials/<result>.
#
# Given a ClusterClaim, the admin kubeconfig lives in a Secret in the claimed cluster's
# namespace, which Hive generates per cluster (pool-1-xxxxx) and reports on the claim.
# Access to that namespace comes from listing this pipeline's ServiceAccount in
# ClusterClaim.spec.subjects at claim time — Hive creates the RoleBinding, so no
# cluster-wide secret read is needed here.
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata:
  name: hive-get-kubeconfig
spec:
  description: |
    Fetches the admin kubeconfig for a claimed Hive cluster and writes it into the
    given volume.
  params:
    - name: hubSecretRef
      type: string
      description: Secret in the pipeline namespace holding a kubeconfig for the Hive hub.
    - name: claimName
      type: string
      description: Name of the ClusterClaim to resolve.
    - name: poolNamespace
      type: string
      description: Namespace the ClusterPool and its claims live in.
      default: hive-pool-1
    - name: credentials
      type: string
      description: Name of the volume to write the kubeconfig into.
  results:
    - name: kubeconfig
      description: Filename of the kubeconfig written into the credentials volume.
  image: registry.redhat.io/openshift4/ose-cli:latest
  env:
    - name: CLAIM_NAME
      value: $(params.claimName)
    - name: POOL_NAMESPACE
      value: $(params.poolNamespace)
    # Read the hub credential from the Secret directly rather than from a mounted
    # volume, matching eaas-get-ephemeral-cluster-credentials. This keeps the StepAction
    # self-contained: a consuming Task only has to provide the `credentials` volume it
    # already has, and does not also have to declare a volume under a name this file
    # hardcodes.
    - name: HUB_KUBECONFIG_VALUE
      valueFrom:
        secretKeyRef:
          name: $(params.hubSecretRef)
          key: kubeconfig
  volumeMounts:
    - name: $(params.credentials)
      mountPath: /credentials
  script: |
    #!/bin/bash
    set -euo pipefail

    # Hub credential lands in the step's own filesystem, never in the shared
    # credentials volume that downstream steps mount.
    export KUBECONFIG=/tmp/hub-kubeconfig
    trap 'rm -f "$KUBECONFIG"' EXIT
    printf '%s' "$HUB_KUBECONFIG_VALUE" > "$KUBECONFIG"
    chmod 600 "$KUBECONFIG"

    # The claim reports the namespace Hive put the cluster in. It is only populated once
    # the claim has actually been granted, which claim-cluster has already waited for —
    # but re-check rather than assume, so a misordered pipeline fails clearly here.
    CLUSTER_NS=$(oc get clusterclaim "$CLAIM_NAME" -n "$POOL_NAMESPACE" \
                   -o jsonpath='{.spec.namespace}')
    if [[ -z "$CLUSTER_NS" ]]; then
      echo "ERROR: ClusterClaim $CLAIM_NAME has no .spec.namespace yet — not granted?" >&2
      oc get clusterclaim "$CLAIM_NAME" -n "$POOL_NAMESPACE" -o yaml >&2 || true
      exit 1
    fi
    echo "claim $CLAIM_NAME -> cluster namespace $CLUSTER_NS"

    CD_NAME=$(oc get clusterdeployment -n "$CLUSTER_NS" -o jsonpath='{.items[0].metadata.name}')
    SECRET=$(oc get clusterdeployment "$CD_NAME" -n "$CLUSTER_NS" \
               -o jsonpath='{.spec.clusterMetadata.adminKubeconfigSecretRef.name}')
    if [[ -z "$SECRET" ]]; then
      echo "ERROR: ClusterDeployment $CD_NAME has no adminKubeconfigSecretRef" >&2
      exit 1
    fi

    OUT="kubeconfig"
    oc extract "secret/$SECRET" -n "$CLUSTER_NS" --keys=kubeconfig --to=- > "/credentials/$OUT"
    chmod 600 "/credentials/$OUT"

    # Fail here rather than letting every downstream task fail confusingly on an empty
    # or truncated kubeconfig.
    if [[ ! -s "/credentials/$OUT" ]]; then
      echo "ERROR: extracted kubeconfig is empty" >&2
      exit 1
    fi
    if ! KUBECONFIG="/credentials/$OUT" oc whoami >/dev/null 2>&1; then
      echo "ERROR: extracted kubeconfig does not authenticate to the spoke" >&2
      exit 1
    fi

    echo "spoke: $(KUBECONFIG=/credentials/$OUT oc whoami --show-server)"
    printf '%s' "$OUT" > "$(step.results.kubeconfig.path)"
