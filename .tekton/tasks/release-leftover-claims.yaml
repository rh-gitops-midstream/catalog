---
# Releases any ClusterClaim a z-stream PipelineRun still holds. Run as a finally task of
# catalog-gitops-z-stream.
#
# Each leg releases its own claim in its release-cluster step, but a leg that is killed
# never gets there: the pipeline's tasks timeout, a cancelled run or an evicted pod stops
# the pod first. The claim's lifetime was then the only backstop. On 2026-10-12 the
# operator leg of gitops-catalog-release-1-22-ocp422-7cblr was cancelled at the 4h tasks
# timeout and its claim kept pool-3-dwnkj, with four hours of its 8h lifetime left, until
# it was deleted by hand.
#
# Claims are found by the hive-ops/pipelinerun label hive-suite-leg puts on them, so this
# can only touch claims that PipelineRun created, and it uses the same per-pool credential
# the legs use, whose Role allows deleting claims in that pool and nothing else.
#
# Ported from hive-ops' copy of this pipeline, which has had it since its PR #30.
#
# A task file rather than the pipeline's inline taskSpec because Konflux resolves the
# pipeline at the Snapshot's own commit, while tasks are resolved at CATALOG_TASK_REVISION
# (main). A fix here reaches every run from then on, reruns of older Snapshots included.
# For the same reason keep these params stable: a new one needs a default, since pipelines
# already built will not pass it.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: release-leftover-claims
spec:
  params:
    - name: hubSecretRef
      type: string
    - name: poolNamespace
      type: string
    - name: pipelineRunName
      type: string
  volumes:
    - name: hub-kubeconfig
      secret:
        secretName: $(params.hubSecretRef)
  steps:
    - name: release
      # The image hive-suite-leg's own claim and release steps use, so it is known to pull
      # here. Not the pipeline's test image: this has to work when the build of that image
      # is the thing that went wrong.
      image: registry.redhat.io/openshift4/ose-cli:latest
      volumeMounts:
        - name: hub-kubeconfig
          mountPath: /hub
      env:
        - name: POOL_NAMESPACE
          value: $(params.poolNamespace)
        - name: PIPELINE_RUN
          value: $(params.pipelineRunName)
      script: |
        #!/bin/bash
        set -uo pipefail
        export KUBECONFIG=/hub/kubeconfig
        # A claim its leg already released stays listed, with a deletionTimestamp, until
        # Hive finishes deprovisioning the cluster; that is not a leftover. (oc's JSONPath
        # has no negated filter, hence the second column, read back in plain bash.)
        if ! claims=$(oc get clusterclaim -n "$POOL_NAMESPACE" \
                      -l "hive-ops/pipelinerun=$PIPELINE_RUN" \
                      -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.deletionTimestamp}{"\n"}{end}'); then
          # Say so rather than report "nothing to release" on a failed lookup.
          echo "::warning::could not list claims for $PIPELINE_RUN; any left behind will be reclaimed by their lifetime"
          exit 0
        fi
        left=$(while read -r name deleting; do
                 [[ -n "$name" && -z "${deleting:-}" ]] && echo "$name"
               done <<<"$claims")
        if [[ -z "$left" ]]; then
          echo "no leftover claims for $PIPELINE_RUN — every leg released its own"
          exit 0
        fi
        while IFS= read -r claim; do
          [[ -z "$claim" ]] && continue
          echo "releasing leftover claim $claim (its leg did not reach release-cluster)"
          oc delete clusterclaim "$claim" -n "$POOL_NAMESPACE" --wait=false || \
            echo "::warning::could not delete $claim; its lifetime will reclaim the cluster"
        done <<<"$left"
        # Never fail the run from here: a release problem is not a test result, and the
        # claim lifetime remains as the backstop.
        exit 0
