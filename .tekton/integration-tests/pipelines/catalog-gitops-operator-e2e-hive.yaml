---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitops-catalog-operator-e2e-hive
spec:
  description: |
    Integration test which leases a cluster from a Hive ClusterPool, deploys GitOps Operator from catalog, and runs e2e tests.
  params:
    - description: Snapshot of the application
      name: SNAPSHOT
      default: '{"components": [{"name":"gitops-operator-bundle-main", "containerImage": "quay.io/redhat-user-workloads/rh-openshift-gitops-tenant/gitops-operator-bundle:latest"}]}'
      type: string
    - description: Namespace where the Operator bundle will be deployed.
      name: NAMESPACE
      default: default
      type: string
    - description: Duration to wait for bundle installation to complete before failing.
      name: INSTALL_TIMEOUT
      default: 25m
      type: string
    - description: Git URL of catalog repository (used to resolve task definitions only; source URL for builds is auto-derived from SNAPSHOT)
      name: CATALOG_TASK_URL
      default: "https://github.com/rh-gitops-midstream/catalog"
      type: string
    - description: Git revision for task definitions (used to resolve task definitions only; source revision for builds is auto-derived from SNAPSHOT)
      name: CATALOG_TASK_REVISION
      default: "konflux-integration"
      type: string
    - description: OpenShift version to provision (minor version e.g. "4.14", or full patch version e.g. "4.14.57")
      name: OPENSHIFT_VERSION
      default: "4.14"
      type: string
    - description: Operator channel to use for installation (e.g., latest, stable). For upgrade testing, set to the pre-upgrade channel.
      name: OPERATOR_CHANNEL
      default: "latest"
      type: string
    - description: Enable FIPS mode for the ephemeral cluster
      name: FIPS_ENABLED
      default: "false"
      type: string
    - description: Specific GitOps operator version to install (e.g., "1.14.0"). Leave empty to install the latest available on the channel.
      name: OPERATOR_VERSION
      default: ""
      type: string
    - description: Enable auto-upgrade on the operator subscription
      name: AUTO_UPGRADE
      default: "false"
      type: string
    - description: Perform an upgrade after initial installation by switching to UPGRADE_TO_CHANNEL
      name: UPGRADE
      default: "false"
      type: string
    - description: Channel to switch to for upgrade testing (only used when UPGRADE is "true")
      name: UPGRADE_TO_CHANNEL
      default: "latest"
      type: string
    - description: Git URL of the test repository
      name: TEST_REPO_URL
      default: "https://github.com/redhat-developer/gitops-operator.git"
      type: string
    - description: Git branch or revision of the test repository
      name: TEST_REPO_BRANCH
      default: "master"
      type: string
    - description: Test runner script name (e.g., run-parallel-tests.sh, run-sequential-tests.sh, run-rollouts-tests.sh)
      name: TEST_SCRIPT
      default: "run-parallel-tests.sh"
      type: string
    - description: PR label required to run tests (empty = no gating, always run). When set, push events always proceed but pull_request events require this label on the PR.
      name: GATE_LABEL
      default: ""
      type: string
    - name: HIVE_HUB_SECRET
      type: string
      default: hive-hub-kubeconfig
      description: Secret in this namespace holding a kubeconfig for the Hive hub.
    - name: POOL_NAME
      type: string
      default: pool-1
      description: ClusterPool to lease from. Pools are declared in the hive-ops repo; this pipeline only claims from them.
    - name: POOL_NAMESPACE
      type: string
      default: hive-pool-1
      description: Namespace the ClusterPool and its claims live in.
    - name: CLAIM_LIFETIME
      type: string
      default: 4h
      description: Backstop TTL on the claim. If this PipelineRun is cancelled or hangs, Hive reclaims the cluster when this expires.
  finally:
    - name: pipeline-wrapup
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/hive-pipeline-wrapup.yaml
      params:
        - name: hubSecretRef
          value: $(params.HIVE_HUB_SECRET)
        - name: claimName
          value: $(tasks.claim-cluster.results.claimName)
        - name: poolNamespace
          value: $(params.POOL_NAMESPACE)
        - name: catalogTaskUrl
          value: $(params.CATALOG_TASK_URL)
        - name: catalogTaskRevision
          value: $(params.CATALOG_TASK_REVISION)
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
        - name: testImageUrl
          value: "$(tasks.overlay-test-scripts.results.image-url)"
        - name: aggregateStatus
          value: "$(tasks.status)"
        - name: logUrl
          value: "https://konflux-ui.apps.stone-prd-rh01.pg1f.p1.openshiftapps.com/ns/rh-openshift-gitops-tenant/applications/gitops-main/pipelineruns/$(context.pipelineRun.name)"
        - name: pipelineName
          value: "gitops-operator-e2e-hive"
        - name: namespace
          value: "openshift-gitops-operator"
        - name: taskNames
          value: "install-operator upgrade-operator test-operator logs"
        - name: openshiftVersion
          value: "$(params.OPENSHIFT_VERSION)"
        - name: resolvedOpenshiftVersion
          value: "$(params.OPENSHIFT_VERSION)"
        - name: operatorChannel
          value: "$(params.OPERATOR_CHANNEL)"
        - name: fipsEnabled
          value: "$(params.FIPS_ENABLED)"
        - name: installedCSV
          value: "$(tasks.install-operator.results.installedCSV)"
        - name: testScript
          value: "$(params.TEST_SCRIPT)"
        - name: testRepoUrl
          value: "$(params.TEST_REPO_URL)"
        - name: testRepoBranch
          value: "$(params.TEST_REPO_BRANCH)"
        - name: upgrade
          value: "$(params.UPGRADE)"
  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: check-gate
      runAfter:
        - parse-metadata
      taskSpec:
        params:
          - name: gate-labels
            type: string
          - name: source-git-url
            type: string
          - name: source-git-revision
            type: string
          - name: catalog-task-url
            type: string
          - name: catalog-task-revision
            type: string
        results:
          - name: proceed
            description: "true if tests should run, false to skip"
        steps:
          - name: check
            ref:
              resolver: git
              params:
                - name: url
                  value: $(params.catalog-task-url)
                - name: revision
                  value: $(params.catalog-task-revision)
                - name: pathInRepo
                  value: .tekton/stepactions/check-gate-labels.yaml
            params:
              - name: gate-labels
                value: $(params.gate-labels)
              - name: source-git-url
                value: $(params.source-git-url)
              - name: source-git-revision
                value: $(params.source-git-revision)
          - name: propagate-result
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/sh
              cat /tekton/steps/step-check/results/proceed > $(results.proceed.path)
      params:
        - name: gate-labels
          value: $(params.GATE_LABEL)
        - name: source-git-url
          value: $(tasks.parse-metadata.results.source-git-url)
        - name: source-git-revision
          value: $(tasks.parse-metadata.results.source-git-revision)
        - name: catalog-task-url
          value: $(params.CATALOG_TASK_URL)
        - name: catalog-task-revision
          value: $(params.CATALOG_TASK_REVISION)
    - name: build-test-image
      runAfter:
        - check-gate
      when:
        - input: $(tasks.check-gate.results.proceed)
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/build-ginkgo-test-image.yaml
      params:
        - name: SOURCE_URL
          value: $(params.CATALOG_TASK_URL)
        - name: SOURCE_REVISION
          value: $(params.CATALOG_TASK_REVISION)
        - name: IMAGE_EXPIRES_AFTER
          value: "7d"
    - name: overlay-test-scripts
      runAfter:
        - build-test-image
      when:
        - input: $(tasks.check-gate.results.proceed)
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/overlay-test-scripts.yaml
      params:
        - name: BASE_IMAGE_URL
          value: $(tasks.build-test-image.results.IMAGE_URL)
        - name: SOURCE_URL
          value: $(params.CATALOG_TASK_URL)
        - name: SOURCE_REVISION
          value: $(params.CATALOG_TASK_REVISION)
    - name: install-operator
      runAfter:
        - claim-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/hive-install-operator.yaml
      params:
        - name: hubSecretRef
          value: $(params.HIVE_HUB_SECRET)
        - name: claimName
          value: $(tasks.claim-cluster.results.claimName)
        - name: poolNamespace
          value: $(params.POOL_NAMESPACE)
        - name: catalogTaskUrl
          value: $(params.CATALOG_TASK_URL)
        - name: catalogTaskRevision
          value: $(params.CATALOG_TASK_REVISION)
        - name: testImageUrl
          value: "$(tasks.overlay-test-scripts.results.image-url)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
        - name: openshiftVersion
          value: "$(params.OPENSHIFT_VERSION)"
        - name: installTimeout
          value: "$(params.INSTALL_TIMEOUT)"
        - name: operatorChannel
          value: "$(params.OPERATOR_CHANNEL)"
        - name: operatorVersion
          value: "$(params.OPERATOR_VERSION)"
        - name: autoUpgrade
          value: "$(params.AUTO_UPGRADE)"
        - name: upgrade
          value: "$(params.UPGRADE)"
        - name: upgradeToChannel
          value: "$(params.UPGRADE_TO_CHANNEL)"
    - name: test-operator
      runAfter:
        - install-operator
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/hive-test-operator.yaml
      params:
        - name: hubSecretRef
          value: $(params.HIVE_HUB_SECRET)
        - name: claimName
          value: $(tasks.claim-cluster.results.claimName)
        - name: poolNamespace
          value: $(params.POOL_NAMESPACE)
        - name: catalogTaskUrl
          value: $(params.CATALOG_TASK_URL)
        - name: catalogTaskRevision
          value: $(params.CATALOG_TASK_REVISION)
        - name: testImageUrl
          value: "$(tasks.overlay-test-scripts.results.image-url)"
        - name: pipelineRunName
          value: "$(context.pipelineRun.name)"
        - name: testRepoUrl
          value: "$(params.TEST_REPO_URL)"
        - name: testRepoBranch
          value: "$(params.TEST_REPO_BRANCH)"
        - name: testScript
          value: "$(params.TEST_SCRIPT)"
        - name: openshiftVersion
          value: "$(params.OPENSHIFT_VERSION)"
        - name: catalogUrl
          value: "$(params.CATALOG_TASK_URL)"
        - name: catalogRevision
          value: "$(params.CATALOG_TASK_REVISION)"
    - name: claim-cluster
      runAfter:
        - overlay-test-scripts
      when:
        - input: $(tasks.check-gate.results.proceed)
          operator: in
          values:
            - "true"
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/hive-claim-cluster.yaml
      params:
        - name: hubSecretRef
          value: $(params.HIVE_HUB_SECRET)
        - name: poolName
          value: $(params.POOL_NAME)
        - name: poolNamespace
          value: $(params.POOL_NAMESPACE)
        - name: lifetime
          value: $(params.CLAIM_LIFETIME)
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
