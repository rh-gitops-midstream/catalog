---
# Release-candidate pipeline: everything a z-stream needs, in one PipelineRun.
#
# This is the Konflux port of the downstream z-stream-test-pipeline. Same intent — install
# the build under test on a real cluster and run the whole suite set against it — but the
# cluster comes from a Hive ClusterPool rather than Flexy, the catalog under test comes
# from the Konflux snapshot rather than a Brew IIB, and the test image is the one this
# repo builds.
#
# Why one pipeline instead of the 45 IntegrationTestScenarios that exist today: for a
# release you want one thing to trigger and one thing to look at. The per-component
# scenarios stay as they are for PR feedback; this sits alongside them as the release gate.
#
# How many clusters a run uses is the LEGS parameter, not the pipeline structure. Each
# entry is a comma-separated list of suites that share one cluster:
#
#   fan out, 6 clusters — wall clock is the longest leg, which is now argocd-e2e
#     ["run-sanity-tests.sh", "run-parallel-tests.sh",
#      "run-sequential-tests-shard1.sh", "run-sequential-tests-shard2.sh",
#      "run-rollouts-tests.sh", "run-argocd-e2e-standalone.sh"]
#
#   middle, ~3.5h, 2 clusters — sequential is the long pole, everything else rides along
#     ["run-sanity-tests.sh,run-parallel-tests.sh,run-rollouts-tests.sh",
#      "run-sequential-tests-shard1.sh,run-sequential-tests-shard2.sh"]
#
#   cheapest, ~6h, 1 cluster
#     ["run-sanity-tests.sh,run-parallel-tests.sh,run-sequential-tests-shard1.sh,run-sequential-tests-shard2.sh,run-rollouts-tests.sh"]
#
# Collapsing is editing that array. No task or pipeline change, so the cost/wall-clock
# trade-off can be made per release.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gitops-catalog-z-stream
spec:
  description: |
    Runs the full release test set against a Konflux snapshot on Hive-provisioned
    clusters, publishing one result row per suite to catalog-results.
  params:
    - name: SNAPSHOT
      type: string
      default: '{"components": [{"name":"gitops-operator-bundle-main", "containerImage": "quay.io/redhat-user-workloads/rh-openshift-gitops-tenant/gitops-operator-bundle:latest"}]}'
    - name: LEGS
      type: array
      description: >-
        One entry per cluster; each entry is a comma-separated list of suites to run on
        it, in order. See the header for worked examples.
      default:
        - run-sanity-tests.sh
        - run-parallel-tests.sh
        - run-sequential-tests-shard1.sh
        - run-sequential-tests-shard2.sh
        - run-rollouts-tests.sh
        - run-argocd-e2e-standalone.sh
    - name: CATALOG_TASK_URL
      type: string
      default: https://github.com/rh-gitops-midstream/catalog
    - name: CATALOG_TASK_REVISION
      type: string
      default: main
    - name: OPENSHIFT_VERSION
      type: string
      default: "4.20"
    - name: OPERATOR_CHANNEL
      type: string
      default: latest
    - name: OPERATOR_VERSION
      type: string
      default: ""
    - name: NAMESPACE
      type: string
      default: openshift-gitops-operator
    - name: TEST_REPO_URL
      type: string
      default: https://github.com/rh-gitops-release-qa/gitops-operator
    - name: TEST_REPO_BRANCH
      type: string
      default: konflux-integration-latest
    - name: POOL_NAME
      type: string
      default: pool-1
    - name: POOL_NAMESPACE
      type: string
      default: hive-pool-1
    - name: CLAIM_LIFETIME
      type: string
      description: >-
        Must exceed the longest leg, and it applies to every leg — Hive takes one lifetime
        per claim, so this is sized for the worst case rather than per suite. argocd-e2e
        is now that worst case; the downstream z-stream task allows it 4h30m. A leg
        carrying both sequential shards runs about 3h30m; one carrying everything, about
        6h. The pool caps claims at 8h.
      default: "6h"
    - name: HIVE_HUB_SECRET
      type: string
      default: hive-hub-kubeconfig
    - name: GATE_LABEL
      type: string
      default: "release-candidate"
      description: >-
        PR label required to run. A release run claims one cluster per LEGS entry, so
        this must stay set — without a gate every snapshot would fan out the full
        matrix. Set to empty only for manual testing.

  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    - name: check-gate
      runAfter: [parse-metadata]
      taskSpec:
        params:
          - name: gate-labels
            type: string
          - name: source-git-url
            type: string
          - name: source-git-revision
            type: string
          - name: catalog-task-url
            type: string
          - name: catalog-task-revision
            type: string
        results:
          - name: proceed
            description: "true if tests should run, false to skip"
        steps:
          - name: check
            ref:
              resolver: git
              params:
                - name: url
                  value: $(params.catalog-task-url)
                - name: revision
                  value: $(params.catalog-task-revision)
                - name: pathInRepo
                  value: .tekton/stepactions/check-gate-labels.yaml
            params:
              - name: gate-labels
                value: $(params.gate-labels)
              - name: source-git-url
                value: $(params.source-git-url)
              - name: source-git-revision
                value: $(params.source-git-revision)
          - name: propagate-result
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              cat /tekton/steps/step-check/results/proceed > $(results.proceed.path)
      params:
        - name: gate-labels
          value: $(params.GATE_LABEL)
        - name: source-git-url
          value: $(tasks.parse-metadata.results.source-git-url)
        - name: source-git-revision
          value: $(tasks.parse-metadata.results.source-git-revision)
        - name: catalog-task-url
          value: $(params.CATALOG_TASK_URL)
        - name: catalog-task-revision
          value: $(params.CATALOG_TASK_REVISION)

    - name: build-test-image
      runAfter: [check-gate]
      when:
        - input: $(tasks.check-gate.results.proceed)
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/build-ginkgo-test-image.yaml
      params:
        - name: SOURCE_URL
          value: $(params.CATALOG_TASK_URL)
        - name: SOURCE_REVISION
          value: $(params.CATALOG_TASK_REVISION)
        - name: IMAGE_EXPIRES_AFTER
          value: "7d"

    - name: overlay-test-scripts
      runAfter: [build-test-image]
      when:
        - input: $(tasks.check-gate.results.proceed)
          operator: in
          values: ["true"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/overlay-test-scripts.yaml
      params:
        - name: BASE_IMAGE_URL
          value: $(tasks.build-test-image.results.IMAGE_URL)
        - name: SOURCE_URL
          value: $(params.CATALOG_TASK_URL)
        - name: SOURCE_REVISION
          value: $(params.CATALOG_TASK_REVISION)

    # The whole fan-out. One instance of hive-suite-leg per LEGS entry, each claiming its
    # own cluster. A leg that fails fails the PipelineRun; the detail is in the per-suite
    # rows it published to catalog-results.
    - name: run-legs
      runAfter: [overlay-test-scripts]
      when:
        - input: $(tasks.check-gate.results.proceed)
          operator: in
          values: ["true"]
      matrix:
        params:
          - name: suites
            value: $(params.LEGS)
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.CATALOG_TASK_URL)
          - name: revision
            value: $(params.CATALOG_TASK_REVISION)
          - name: pathInRepo
            value: .tekton/tasks/hive-suite-leg.yaml
      params:
        - name: testImageUrl
          value: $(tasks.overlay-test-scripts.results.image-url)
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: hubSecretRef
          value: $(params.HIVE_HUB_SECRET)
        - name: poolName
          value: $(params.POOL_NAME)
        - name: poolNamespace
          value: $(params.POOL_NAMESPACE)
        - name: claimLifetime
          value: $(params.CLAIM_LIFETIME)
        - name: openshiftVersion
          value: $(params.OPENSHIFT_VERSION)
        - name: operatorChannel
          value: $(params.OPERATOR_CHANNEL)
        - name: operatorVersion
          value: $(params.OPERATOR_VERSION)
        - name: namespace
          value: $(params.NAMESPACE)
        - name: testRepoUrl
          value: $(params.TEST_REPO_URL)
        - name: testRepoBranch
          value: $(params.TEST_REPO_BRANCH)
        - name: catalogUrl
          value: $(params.CATALOG_TASK_URL)
        - name: catalogRevision
          value: $(params.CATALOG_TASK_REVISION)
        # The catalog FBC built for this Snapshot. Without it install-operator falls
        # back to the floating catalog:v<ocp> tag -- main, not the change under test.
        - name: catalogImage
          value: $(tasks.parse-metadata.results.component-container-image)

  finally:
    # Releases any ClusterClaim this run still holds. Each leg releases its own claim in
    # its release-cluster step, but a leg that is killed never gets there: the pipeline's
    # tasks timeout, a cancelled run or an evicted pod stops the pod first. The claim's
    # lifetime was then the only backstop. On 2026-10-12 the operator leg of
    # gitops-catalog-release-1-22-ocp422-7cblr was cancelled at the 4h tasks timeout and
    # its claim kept pool-3-dwnkj, with four hours of its 8h lifetime left, until it was
    # deleted by hand.
    #
    # Finally tasks run however the legs ended, and have their own timeout. Claims are
    # found by the hive-ops/pipelinerun label hive-suite-leg puts on them, so this can
    # only touch claims this PipelineRun created, and it uses the same per-pool credential
    # the legs use, whose Role allows deleting claims in that pool and nothing else.
    #
    # Ported from hive-ops' copy of this pipeline, which has had it since its PR #30.
    - name: release-leftover-claims
      params:
        - name: hubSecretRef
          value: $(params.HIVE_HUB_SECRET)
        - name: poolNamespace
          value: $(params.POOL_NAMESPACE)
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
      taskSpec:
        params:
          - name: hubSecretRef
            type: string
          - name: poolNamespace
            type: string
          - name: pipelineRunName
            type: string
        volumes:
          - name: hub-kubeconfig
            secret:
              secretName: $(params.hubSecretRef)
        steps:
          - name: release
            # The image hive-suite-leg's own claim and release steps use, so it is known
            # to pull here. Not the pipeline's test image: this has to work when the
            # build of that image is the thing that went wrong.
            image: registry.redhat.io/openshift4/ose-cli:latest
            volumeMounts:
              - name: hub-kubeconfig
                mountPath: /hub
            env:
              - name: POOL_NAMESPACE
                value: $(params.poolNamespace)
              - name: PIPELINE_RUN
                value: $(params.pipelineRunName)
            script: |
              #!/bin/bash
              set -uo pipefail
              export KUBECONFIG=/hub/kubeconfig
              if ! left=$(oc get clusterclaim -n "$POOL_NAMESPACE" \
                            -l "hive-ops/pipelinerun=$PIPELINE_RUN" \
                            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); then
                # Say so rather than report "nothing to release" on a failed lookup.
                echo "::warning::could not list claims for $PIPELINE_RUN; any left behind will be reclaimed by their lifetime"
                exit 0
              fi
              if [[ -z "$left" ]]; then
                echo "no leftover claims for $PIPELINE_RUN — every leg released its own"
                exit 0
              fi
              while IFS= read -r claim; do
                [[ -z "$claim" ]] && continue
                echo "releasing leftover claim $claim (its leg did not reach release-cluster)"
                oc delete clusterclaim "$claim" -n "$POOL_NAMESPACE" --wait=false || \
                  echo "::warning::could not delete $claim; its lifetime will reclaim the cluster"
              done <<<"$left"
              # Never fail the run from here: a release problem is not a test result, and
              # the claim lifetime remains as the backstop.
              exit 0

    # Deliberately thin. Each leg already published one row per suite to catalog-results
    # and uploaded its own logs, so there is nothing to collate here — this just says
    # where to look and how each leg came out.
    - name: summary
      params:
        - name: verdicts
          value: $(tasks.run-legs.results.verdict[*])
        - name: clusters
          value: $(tasks.run-legs.results.clusterName[*])
        - name: pipelineRunName
          value: $(context.pipelineRun.name)
        - name: aggregateStatus
          value: $(tasks.status)
        - name: suites
          value: $(tasks.run-legs.results.suites[*])
        - name: openshiftVersion
          value: $(params.OPENSHIFT_VERSION)
        - name: operatorChannel
          value: $(params.OPERATOR_CHANNEL)
        - name: snapshot
          value: $(params.SNAPSHOT)
        - name: gitRevision
          value: $(tasks.parse-metadata.results.source-git-revision)
      taskSpec:
        params:
          - name: verdicts
            type: array
          - name: clusters
            type: array
          - name: pipelineRunName
            type: string
          - name: aggregateStatus
            type: string
          - name: suites
            type: array
          - name: openshiftVersion
            type: string
          - name: operatorChannel
            type: string
          - name: snapshot
            type: string
          - name: gitRevision
            type: string
        steps:
          - name: report
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            args: ["$(params.verdicts[*])"]
            script: |
              #!/bin/bash
              # Plain stdout. This is a Tekton task, not a GitHub Actions step — there is
              # no $GITHUB_STEP_SUMMARY here, and referencing one under `set -u` is an
              # unbound variable that fails the step.
              set -uo pipefail
              echo "=========================================================="
              echo " z-stream run $(params.pipelineRunName)"
              echo " overall: $(params.aggregateStatus)"
              echo "=========================================================="
              i=0
              for v in "$@"; do
                echo "  leg $i: $v"
                i=$((i+1))
              done
              echo
              echo "Per-suite results, including which specs failed, are in"
              echo "rh-gitops-release-qa/catalog-results — one row per suite, tagged"
              echo "with this run name."

          # Posts the same summary to Slack, one line per suite. Only runs that reach the
          # legs get here: a run the gate skipped has no leg results, so this task is
          # skipped with it and the channel only hears about real test runs.
          #
          # Never fails the run: a notification problem is not a test result.
          - name: notify-slack
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            onError: continue
            env:
              - name: SLACK_WEBHOOK_URL
                valueFrom:
                  secretKeyRef:
                    name: slack-gitops-test-notification-url
                    key: hook-url
                    # Without the secret the run should still complete, just quietly.
                    optional: true
              - name: PIPELINE_RUN
                value: $(params.pipelineRunName)
              - name: STATUS
                value: $(params.aggregateStatus)
              - name: OPENSHIFT_VERSION
                value: $(params.openshiftVersion)
              - name: OPERATOR_CHANNEL
                value: $(params.operatorChannel)
              - name: SNAPSHOT
                value: $(params.snapshot)
              - name: GIT_REVISION
                value: $(params.gitRevision)
            # Three arrays, one index per leg, separated by "--".
            args: ["$(params.verdicts[*])", "--", "$(params.clusters[*])", "--", "$(params.suites[*])"]
            script: |
              #!/bin/bash
              set -uo pipefail
              if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
                echo "no Slack webhook configured; not notifying"
                exit 0
              fi

              verdicts=(); clusters=(); suites=(); part=0
              for a in "$@"; do
                if [[ "$a" == "--" ]]; then part=$((part+1)); continue; fi
                case $part in
                  0) verdicts+=("$a") ;;
                  1) clusters+=("$a") ;;
                  *) suites+=("$a") ;;
                esac
              done

              # The Snapshot carries its Application, which is part of the UI link.
              app=$(grep -oE '"application" *: *"[^"]+"' <<<"$SNAPSHOT" | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
              ui="https://konflux-ui.apps.stone-prd-rh01.pg1f.p1.openshiftapps.com/ns/rh-openshift-gitops-tenant"
              [[ -n "$app" ]] && ui="$ui/applications/$app/pipelineruns/$PIPELINE_RUN"

              if [[ "$STATUS" == "Succeeded" || "$STATUS" == "Completed" ]]; then
                head=":white_check_mark: *GitOps release tests passed*"
              else
                head=":x: *GitOps release tests failed*"
              fi

              msg="$head: \`$OPERATOR_CHANNEL\` on OpenShift $OPENSHIFT_VERSION"
              msg+=$'\n'"Run <$ui|$PIPELINE_RUN>, catalog commit \`${GIT_REVISION:0:7}\`"
              for i in "${!verdicts[@]}"; do
                msg+=$'\n\n'"*Leg $((i+1))* (${clusters[$i]:-unknown}): ${verdicts[$i]}"
                lines="${suites[$i]:-}"
                [[ -z "$lines" ]] && msg+=$'\n'"    no suites ran (the claim or the install failed)"
                while read -r script outcome passed failed; do
                  [[ -z "$script" ]] && continue
                  icon=":white_check_mark:"; [[ "$outcome" == "pass" ]] || icon=":x:"
                  line="$icon ${script%.sh}"
                  [[ -n "${passed:-}" ]] && line+=" — $passed passed, $failed failed"
                  msg+=$'\n'"$line"
                done <<<"$lines"
              done
              msg+=$'\n\n'"Per-suite rows and log links: rh-gitops-release-qa/catalog-results"

              # JSON-escape by hand; this image has no jq or python.
              esc=$(printf '%s' "$msg" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\t/\\t/g' | sed -e ':a;N;$!ba;s/\n/\\n/g')
              if curl -fsS -m 20 -X POST -H 'Content-type: application/json' \
                   --data "{\"text\":\"$esc\"}" "$SLACK_WEBHOOK_URL" >/dev/null; then
                echo "posted the summary to Slack"
              else
                echo "::warning::could not post the summary to Slack"
              fi
