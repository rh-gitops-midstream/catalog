---
# Spike: one scenario running on a Hive-leased cluster instead of an EaaS HyperShift one.
#
# Deliberately a single scenario. It mirrors gitops-catalog-operator-parallel from
# gitops-operator-tests.yaml exactly — same test script, channel, repo and branch — so
# any difference in the result is attributable to the cluster underneath rather than to
# the test configuration. Once this is trusted, the remaining scenarios are a copy with
# TEST_SCRIPT/OPERATOR_CHANNEL changed.
#
# Marked optional, like the EaaS scenarios, so it cannot block a release while the Hive
# path is still being proven.
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: gitops-catalog-operator-parallel-hive
  namespace: rh-openshift-gitops-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: catalog-4-20
  contexts:
    - description: execute on component build
      name: component_catalog-4-20
  params:
    - name: TEST_IMAGE_URL
      value: quay.io/devtools_gitops/test_image:konflux_v1.21.0
    - name: TEST_SCRIPT
      value: run-parallel-tests.sh
    - name: OPENSHIFT_VERSION
      value: "4.20"
    - name: OPERATOR_CHANNEL
      value: latest
    - name: TEST_REPO_URL
      value: https://github.com/rh-gitops-release-qa/gitops-operator
    - name: TEST_REPO_BRANCH
      value: konflux-integration-latest
    - name: GATE_LABEL
      value: rc-operator-check
    # Pool selection. The pool itself is declared in the hive-ops repo
    # (pools/pool-1/) — this only says which one to lease from.
    - name: POOL_NAME
      value: pool-1
    - name: POOL_NAMESPACE
      value: hive-pool-1
    # Backstop if this PipelineRun is cancelled or hangs: Hive reclaims the cluster
    # when the claim expires, rather than leaving a full IPI cluster billing.
    - name: CLAIM_LIFETIME
      value: "4h"
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/rh-gitops-midstream/catalog
      - name: revision
        value: konflux-integration
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/catalog-gitops-operator-e2e-hive.yaml
---
# Argo Rollouts suite on a Hive-leased cluster.
#
# Mirrors gitops-catalog-operator-rollouts from gitops-operator-tests.yaml, changing
# only the provisioner, so a difference in results points at the cluster rather than the
# test configuration.
#
# Note this suite patches the operator Subscription's spec.config.env to set
# CLUSTER_SCOPED_ARGO_ROLLOUTS_NAMESPACES. That is the same mutation that collided with
# Hive on our hand-managed clusters, where a SelectorSyncSet owned the Subscription and
# kept reverting it. It is safe here precisely because pool clusters are bare: they carry
# no hive-ops/gitops-prerelease label, so nothing on the hub manages their Subscription
# and the pipeline owns it outright.
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: gitops-catalog-operator-rollouts-hive
  namespace: rh-openshift-gitops-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: catalog-4-20
  contexts:
    - description: execute on component build
      name: component_catalog-4-20
  params:
    - name: TEST_IMAGE_URL
      value: quay.io/devtools_gitops/test_image:konflux_v1.21.0
    - name: TEST_SCRIPT
      value: run-rollouts-tests.sh
    - name: OPENSHIFT_VERSION
      value: "4.20"
    - name: OPERATOR_CHANNEL
      value: latest
    - name: TEST_REPO_URL
      value: https://github.com/rh-gitops-release-qa/gitops-operator
    - name: TEST_REPO_BRANCH
      value: konflux-integration-latest
    - name: GATE_LABEL
      value: rc-operator-check
    - name: POOL_NAME
      value: pool-1
    - name: POOL_NAMESPACE
      value: hive-pool-1
    - name: CLAIM_LIFETIME
      value: "4h"
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/rh-gitops-midstream/catalog
      - name: revision
        value: konflux-integration
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/catalog-gitops-operator-e2e-hive.yaml
