---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: gitops-catalog-release-1-19-ocp420
  namespace: rh-openshift-gitops-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: catalog-4-20
  contexts:
    - description: execute on component build
      name: component_catalog-4-20
  params:
    # Three legs, one cluster each. Everything is covered and wall clock is the
    # argocd-e2e leg (~4h30m) rather than the ~6h a single-cluster run would take.
    - name: LEGS
      values:
        - "run-sanity-tests.sh,run-parallel-tests.sh,run-rollouts-tests.sh"
        - "run-sequential-tests-shard1.sh,run-sequential-tests-shard2.sh"
        - "run-argocd-e2e-standalone.sh"
    - name: TEST_REPO_URL
      value: https://github.com/rh-gitops-release-qa/gitops-operator
    - name: TEST_REPO_BRANCH
      value: konflux-integration-1.19
    - name: OPENSHIFT_VERSION
      value: "4.20"
    - name: OPERATOR_CHANNEL
      value: gitops-1.19
    - name: GATE_LABEL
      value: release-candidate
    - name: POOL_NAME
      value: pool-1
    - name: POOL_NAMESPACE
      value: hive-pool-1
    - name: CLAIM_LIFETIME
      value: "6h"
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/rh-gitops-midstream/catalog
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/catalog-gitops-z-stream.yaml
