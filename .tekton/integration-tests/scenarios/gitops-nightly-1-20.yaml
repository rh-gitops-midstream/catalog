---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: gitops-catalog-nightly-1-20
  namespace: rh-openshift-gitops-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: catalog-4-20
  contexts:
    - description: execute on component build
      name: component_catalog-4-20
  params:
    - name: SUITES
      value: "run-sanity-tests.sh,run-parallel-tests.sh,run-sequential-tests-shard1.sh,run-sequential-tests-shard2.sh,run-rollouts-tests.sh,run-argocd-e2e-standalone.sh"
    - name: TEST_REPO_URL
      value: https://github.com/rh-gitops-release-qa/gitops-operator
    - name: TEST_REPO_BRANCH
      value: konflux-integration-1.20
    - name: OPENSHIFT_VERSION
      value: "4.20"
    - name: OPERATOR_CHANNEL
      value: gitops-1.20
    - name: GATE_LABEL
      value: nightly
    - name: POOL_NAME
      value: pool-2
    - name: POOL_NAMESPACE
      value: hive-pool-2
    # The hub credential is per pool: each pool has its own konflux-pool-claimer
    # ServiceAccount, scoped to its own namespace, so one shared secret cannot claim
    # from more than one. Must match POOL_NAME above.
    - name: HIVE_HUB_SECRET
      value: hive-hub-kubeconfig-pool-2
    - name: CLAIM_LIFETIME
      value: "8h"
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/rh-gitops-midstream/catalog
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/catalog-gitops-operator-e2e-nightly.yaml
