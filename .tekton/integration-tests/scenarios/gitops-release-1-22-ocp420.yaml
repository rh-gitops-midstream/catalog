---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: gitops-catalog-release-1-22-ocp420
  namespace: rh-openshift-gitops-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
  annotations:
    # Without these the integration service applies its defaults -- tasks 4h, finally 2h,
    # pipeline 6h -- and 4h is not enough for the operator leg. On 2026-10-12 both 1.22
    # runs (…-ocp420-xd5vp, …-ocp422-shmrx) reached the rollouts suite about 3h40m in,
    # with sanity, parallel and both sequential shards done, and were cut off there.
    #
    # 7h of tasks fits inside CLAIM_LIFETIME below: the claim is made about ten minutes
    # into the run and lasts 8h, so the leg is stopped by this timeout, and releases its
    # cluster, well before Hive would take the cluster away mid-test. finally only prints
    # a summary and releases leftover claims, so it does not need the default 2h.
    # pipeline must be at least tasks + finally.
    test.appstudio.openshift.io/tasks_timeout: "7h"
    test.appstudio.openshift.io/finally_timeout: "30m"
    test.appstudio.openshift.io/pipeline_timeout: "7h30m"
spec:
  application: catalog-4-20
  contexts:
    - description: execute on component build
      name: component_catalog-4-20
  params:
    # Two legs, matching the 1.21 scenarios so channels stay comparable.
    - name: LEGS
      values:
        - "run-sanity-tests.sh,run-parallel-tests.sh,run-sequential-tests-shard1.sh,run-sequential-tests-shard2.sh,run-rollouts-tests.sh"
        - "run-argocd-e2e-standalone.sh"
    # Upstream's v1.22 branch directly, not the QA fork the other channels use: the fork
    # has no konflux-integration-1.22 yet. The 1.21 fork branch was the stand-in until
    # 2026-10-12, and against a 1.22 build its expectations are simply stale -- seven of
    # the eight parallel failures in gitops-catalog-release-1-22-ocp422-7cblr were the
    # tests asserting 1.21 behaviour (redis TLS args, the trailing-dot service FQDN, the
    # projected dex token and its volume mount), all of which upstream v1.22 expects.
    #
    # What this gives up is the fork's downstream patches. On 1.21 those are two commits:
    # the agent default-image checks in 1-051/1-052 and the UI tour dialog, which no leg
    # here runs. If 1.22 turns out to need the same, cut konflux-integration-1.22 from
    # upstream/v1.22 as the README describes and point both values back at the fork.
    - name: TEST_REPO_URL
      value: https://github.com/redhat-developer/gitops-operator
    - name: TEST_REPO_BRANCH
      value: v1.22
    - name: OPENSHIFT_VERSION
      value: "4.20"
    - name: OPERATOR_CHANNEL
      value: gitops-1.22
    # Channel-scoped gate only. The release-candidate label is deliberately NOT required
    # while the RC-creation automation is still being built -- gating on channel-1.22
    # alone lets this tier be exercised by hand without depending on that work or
    # disturbing it. Add release-candidate back once the automation lands.
    - name: GATE_LABEL
      value: channel-1.22
    - name: POOL_NAME
      value: pool-2
    - name: POOL_NAMESPACE
      value: hive-pool-2
    # The hub credential is per pool: each pool has its own konflux-pool-claimer
    # ServiceAccount, scoped to its own namespace, so one shared secret cannot claim
    # from more than one. Must match POOL_NAME above.
    - name: HIVE_HUB_SECRET
      value: hive-hub-kubeconfig-pool-2
    # Leg 1 runs about six hours of tests on top of a cluster claim and operator
    # install, so 6h would cut it close. 8h is the pool ceiling.
    - name: CLAIM_LIFETIME
      value: "8h"
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/rh-gitops-midstream/catalog
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/catalog-gitops-z-stream.yaml
