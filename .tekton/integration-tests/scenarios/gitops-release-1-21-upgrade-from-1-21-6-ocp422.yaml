---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: gitops-catalog-release-1-21-upgrade-from-1-21-6-ocp422
  namespace: rh-openshift-gitops-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
  annotations:
    # Without these the integration service applies its defaults -- tasks 4h, finally 2h,
    # pipeline 6h -- and 4h is not enough for a leg that upgrades and then runs the
    # operator suites. 7h of tasks fits inside CLAIM_LIFETIME below: the claim is made
    # about ten minutes into the run and lasts 8h, so the leg is stopped by this timeout,
    # and releases its cluster, well before Hive would take the cluster away mid-test.
    # finally only prints a summary and releases leftover claims. pipeline must be at least
    # tasks + finally.
    test.appstudio.openshift.io/tasks_timeout: "7h"
    test.appstudio.openshift.io/finally_timeout: "30m"
    test.appstudio.openshift.io/pipeline_timeout: "7h30m"
spec:
  # Bound to the 4.22 catalog: the Snapshot this fires on is the catalog built for this
  # OpenShift version, and it is that image the operator is installed from.
  application: catalog-4-22
  contexts:
    - description: execute on component build
      name: component_catalog-4-22
  params:
    # Upgrade, not clean install: each leg starts with the upgrade baseline (the Ginkgo
    # upgrade suite, see run-upgrade-baseline.sh), which installs an older version,
    # configures it, and upgrades it to this channel's head in the Snapshot's catalog --
    # the release candidate. It then removes its own fixture, and the operator suites run
    # against the upgraded installation. The Snapshot's catalog carries every released
    # version, so the source comes from it too.
    #
    # One upgrade path, from 1.21.6, within the channel: the previous z-stream.
    # The other is gitops-catalog-release-1-21-upgrade-from-1-20-ocp422.
    #
    # Same layout as the 1.20 upgrade scenarios: the path is split over two legs, two
    # clusters, each upgrading on its own, because one leg with every suite does not fit
    # the 7h task timeout. Each leg is about 3h30m: claim and baseline about 1h, then
    # sanity, parallel and rollouts, or the two sequential shards. No Argo CD e2e: it tests
    # its own standalone Argo CD, not the operator, so an upgrade changes nothing for it.
    #
    # Failures here only mean something next to a clean-install run of the same
    # Snapshot (gitops-catalog-release-1-21-ocp422).
    - name: LEGS
      values:
        - "run-upgrade-baseline.sh:gitops-1.21:1.21.6,run-sanity-tests.sh,run-parallel-tests.sh,run-rollouts-tests.sh"
        - "run-upgrade-baseline.sh:gitops-1.21:1.21.6,run-sequential-tests-shard1.sh,run-sequential-tests-shard2.sh"
    # The operator suites come from the same branch as the clean-install 1.21 scenario.
    # The upgrade suite itself is on its own branch (run-upgrade-baseline.sh) and does not
    # depend on the operator version.
    - name: TEST_REPO_URL
      value: https://github.com/rh-gitops-release-qa/gitops-operator
    - name: TEST_REPO_BRANCH
      value: konflux-integration-1.21
    - name: OPENSHIFT_VERSION
      value: "4.22"
    - name: OPERATOR_CHANNEL
      value: gitops-1.21
    - name: GATE_LABEL
      value: "channel-1.21|release-1.21"
    # aws-422: OpenShift 4.22, standard (not FIPS), on AWS -- the newest OpenShift version
    # in the release test plan (pools/aws-422 in hive-ops). It keeps no cluster waiting, so
    # each leg's claim gets a cluster installed for it, about 45-50m, inside the 100m claim
    # wait. Its maxSize is 2, for the regional networking quota: one scenario's two legs.
    # The clean-install scenarios of every channel on 4.22 and both 1.21 upgrade paths
    # claim from this pool, so whichever legs Hive does not grant time out on the claim
    # wait. Run them one at a time, labelling the Snapshot for the next when the last
    # finishes.
    - name: POOL_NAME
      value: aws-422
    - name: POOL_NAMESPACE
      value: hive-pool-aws-422
    # The hub credential is per pool: each pool has its own konflux-pool-claimer
    # ServiceAccount, scoped to its own namespace, so one shared secret cannot claim
    # from more than one. Must match POOL_NAME above.
    - name: HIVE_HUB_SECRET
      value: hive-hub-kubeconfig-aws-422
    # The backstop if a leg dies without releasing its cluster. Far longer than either
    # leg should need; 8h is the pool ceiling.
    - name: CLAIM_LIFETIME
      value: "8h"
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/rh-gitops-midstream/catalog
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/catalog-gitops-z-stream.yaml
