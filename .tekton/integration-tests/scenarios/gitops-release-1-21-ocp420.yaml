---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: gitops-catalog-release-1-21-ocp420
  namespace: rh-openshift-gitops-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: catalog-4-20
  contexts:
    - description: execute on component build
      name: component_catalog-4-20
  params:
    # Two legs, one cluster each. argocd-e2e gets its own because it does not share a
    # cluster well with the operator suites; everything else rides one cluster in
    # sequence. The split was chosen when this ran on AWS, where the account had already
    # hit AWSVPCLimitExceeded at six concurrent pool clusters. On pool-2 that ceiling no
    # longer binds, so widening is possible — but it would have to be paid for in pool-2's
    # runningCount, which is sized for this shape.
    - name: LEGS
      values:
        - "run-sanity-tests.sh,run-parallel-tests.sh,run-sequential-tests-shard1.sh,run-sequential-tests-shard2.sh,run-rollouts-tests.sh"
        - "run-argocd-e2e-standalone.sh"
    - name: TEST_REPO_URL
      value: https://github.com/rh-gitops-release-qa/gitops-operator
    - name: TEST_REPO_BRANCH
      value: konflux-integration-1.21
    - name: OPENSHIFT_VERSION
      value: "4.20"
    - name: OPERATOR_CHANNEL
      value: gitops-1.21
    - name: GATE_LABEL
      value: release-candidate
    - name: POOL_NAME
      value: pool-2
    - name: POOL_NAMESPACE
      value: hive-pool-2
    # Leg 1 runs about six hours of tests on top of a cluster claim and operator
    # install, so 6h would cut it close. 8h is the pool ceiling.
    - name: CLAIM_LIFETIME
      value: "8h"
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/rh-gitops-midstream/catalog
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/catalog-gitops-z-stream.yaml
