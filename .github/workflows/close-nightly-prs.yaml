name: Close Nightly PRs

on:
  schedule:
    - cron: '0 16 * * *'

  workflow_dispatch: {}

permissions:
  pull-requests: write

jobs:
  close-nightly-prs:
    name: Close Nightly PRs
    runs-on: ubuntu-24.04
    steps:
      - name: Close open nightly PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          PR_NUMBERS=$(gh pr list --repo "$REPO" \
            --label nightly --state open \
            --json number --jq '.[].number')

          if [ -z "$PR_NUMBERS" ]; then
            exit 0
          fi

          for PR in $PR_NUMBERS; do
            echo "Closing PR #$PR..."
            gh pr close "$PR" --repo "$REPO" --delete-branch \
              --comment "Automatically closed by scheduled cleanup. Nightly PRs are not meant to be merged."
          done

          echo "Closed $(echo "$PR_NUMBERS" | wc -w | tr -d ' ') nightly PR(s)."
